name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run benchmark
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: packaged-extension
          path: dist/ai-bookmark-organizer-*

  # Real browser tests are kept visible and non-gating during the pre-release.
  # A green unit-test job is not evidence of Chrome/Edge/Brave compatibility.
  browser-smoke:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test installed Chrome and Edge with isolated profiles
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          foreach ($browser in $candidates) {
            if (-not (Test-Path $browser)) { throw "Required browser missing: $browser" }
            node tools/browser-smoke.js "$browser"
            if ($LASTEXITCODE -ne 0) { throw "Browser acceptance failed: $browser" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence
          path: dist/smoke-*.png
          if-no-files-found: ignore

  release-beta:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaged-extension
          path: dist
      - name: Publish tested pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.0-beta.1"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists: $tag"
            exit 0
          }
          gh release create $tag "dist/ai-bookmark-organizer-0.3.0.zip" "dist/ai-bookmark-organizer-0.3.0.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AI Bookmark Organizer v0.3.0 beta 1" --notes-file docs/RELEASE.md --prerelease
