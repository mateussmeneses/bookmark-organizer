name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run benchmark
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: packaged-extension
          path: dist/ai-bookmark-organizer-*

  # All three real-browser smoke suites are mandatory before a release.
  browser-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test installed Chrome and Edge with isolated profiles
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          foreach ($browser in $candidates) {
            if (-not (Test-Path $browser)) { throw "Required browser missing: $browser" }
            node tools/browser-smoke.js "$browser"
            if ($LASTEXITCODE -ne 0) { throw "Browser acceptance failed: $browser" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence
          path: dist/smoke-*.png
          if-no-files-found: ignore

  brave-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install verified Brave stable and run disposable-profile smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/brave/brave-browser/releases/download/v1.98.62"
          $name = "BraveBrowserStandaloneSilentSetup.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "$base/$name" -OutFile $installer
          # Official GitHub release v1.98.62 asset digest, obtained from
          # api.github.com/repos/brave/brave-browser/releases/latest.
          $expected = "335c34b06ebbb7997131fac4be4b6d01d720a2df52893a491b4014c0ee1c9be9"
          if ((Get-Item $installer).Length -ne 167977824) { throw "Brave installer size mismatch" }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actual -ine $expected) { throw "Brave standalone installer checksum mismatch" }
          $installerProcess = Start-Process -FilePath $installer -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Brave installer failed with $($installerProcess.ExitCode)" }
          $paths = @(
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
            "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe"
          )
          $browser = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Brave executable not found after installation" }
          node tools/browser-smoke.js "$browser"
          if ($LASTEXITCODE -ne 0) { throw "Brave browser acceptance failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brave-browser-smoke-evidence
          path: dist/smoke-*.png
          if-no-files-found: ignore

  release-beta:
    needs: [test, browser-smoke, brave-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaged-extension
          path: dist
      - name: Publish tested pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.0-beta.6"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists: $tag"
            exit 0
          }
          gh release create $tag "dist/ai-bookmark-organizer-0.3.0.zip" "dist/ai-bookmark-organizer-0.3.0.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AI Bookmark Organizer v0.3.0 beta 6" --notes-file docs/RELEASE.md --prerelease
